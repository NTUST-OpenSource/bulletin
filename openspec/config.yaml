schema: spec-driven

context: |
  bulletin collects NTUST announcements from the school's RPage websites, keeps them for ten years,
  and serves them through a public API and a web frontend at bulletin.ntust.org. Python 3.14,
  FastAPI, psycopg 3, PostgreSQL 18 with PGroonga, managed by uv, deployed with Docker Compose.
  Accepted decisions: docs/decisions.md. Planned changes: docs/roadmap.md. Domain terms:
  GLOSSARY.md. Project rules: AGENTS.md. Every artifact is written in English and uses the
  glossary's terms.

rules:
  proposal:
    - State what is out of scope.
  specs:
    - Every scenario must map to at least one test whose name or docstring names the requirement, pytest for the service and Vitest or Playwright for the frontend.
  design:
    - List user-visible changes (copy, commands, API fields, interaction flow) for the owner to review.
    - Cite decision IDs from docs/decisions.md instead of re-arguing them.
  tasks:
    - Follow xfail-first TDD per requirement, one task to commit the failing test marked xfail(strict=True), one task to implement it and remove the marker.
    - End with running the gate (scripts/gate.sh) and archiving the change.
