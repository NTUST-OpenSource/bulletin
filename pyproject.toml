[project]
name = "bulletin"
version = "0.1.0"
description = "Collects NTUST announcements, keeps them for ten years and serves them."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5",
    "fastapi>=0.163.0",
    "psycopg[binary,pool]>=3.3.9",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.17.3",
    "prek>=0.5.10",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]
