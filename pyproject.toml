[project]
name = "bulletin"
version = "0.1.0"
description = "Collects NTUST announcements, keeps them for ten years and serves them."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5",
    "fastapi>=0.163.0",
    "psycopg[binary,pool]>=3.3.9",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.17.3",
    "prek>=0.5.10",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests", "tests/support"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "CPY001", # the owner adds the license; no per-file headers
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["D", "INP001", "T201"]
# Tests may block on small files inside async tests.
"tests/**" = ["ASYNC240", "D", "INP001", "PLR2004", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["src", "scripts", "tests"]
extraPaths = ["scripts", "tests/support"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["scripts", "tests/support"]
addopts = ["--import-mode=importlib"]
strict = true
xfail_strict = true
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source_pkgs = ["bulletin"]

[tool.coverage.report]
fail_under = 85
exclude_also = ['if __name__ == "__main__":']
show_missing = true
skip_covered = true
